<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>Предпросмотр шаблона</title>
<style>
  body { margin:0; background:#111; }
  .scroll { height:100vh; overflow-y:auto; display:flex; justify-content:center; padding:16px 0; box-sizing:border-box; }
  .frame { width:min(405px,92vw); aspect-ratio:9/16; flex:none; border:6px solid #3a3a3c; border-radius:18px; overflow:hidden; background:#000; }
  iframe { width:100%; height:100%; border:0; pointer-events:none; }  /* без интерактива */
</style></head>
<body><div class="scroll"><div class="frame"><iframe id="f"></iframe></div></div>
<script>
  const id = new URLSearchParams(location.search).get('tpl');
  document.getElementById('f').src = '/display/preview?preview=' + encodeURIComponent(id);
</script></body></html>
